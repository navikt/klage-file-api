spring:
  application:
    name: klage-file-api
  main:
    banner-mode: OFF
  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 50MB
      file-size-threshold: 2MB
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  port: 7080
  error:
    whitelabel:
      enabled: false

management:
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false

GCS_BUCKET: klagefiles